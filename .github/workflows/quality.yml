name: Quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HOTMART_HOTTOK: ci-invalid-hottok-reference
      EVOLUTION_WEBHOOK_SECRET: ci-evolution-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:api -- --reporter=line
      - run: npm run test:webhook -- --reporter=line
      - run: npm run test:e2e:smoke -- --reporter=line
      - run: npm run test:sla -- --reporter=line
